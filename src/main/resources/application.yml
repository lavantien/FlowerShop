spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${LOCAL_MYSQL_DB_HOST}:${LOCAL_MYSQL_DB_PORT}/flowershop
    username: ${LOCAL_MYSQL_DB_USERNAME}
    password: ${LOCAL_MYSQL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

shop:
  delivery:
    base-fee: 20000
    per-km: 5000
    max-fee: 200000
    round-to: 1000
  payment:
    secret: ${FLOWERSHOP_PAYMENT_SECRET:dev-only-secret}
    base-url: /pay
